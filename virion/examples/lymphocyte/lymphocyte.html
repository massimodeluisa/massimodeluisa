:root, .virion[data-theme="dark"]{

}
.virion[data-theme="light"]{
  --v-page:#efeee8; --v-card:#fbfbf8; --v-ink:#5c5b56; --v-strong:#1c1c18; --v-muted:#8a8982;
  --v-paper:#fbfbf8; --v-top:#ffffff; --v-s0:#d9d8d1; --v-s1:#e4e3dc; --v-s2:#eeeee8; --v-s3:#f6f6f2;

}
*{box-sizing:border-box}
body{margin:0;background:var(--v-page);color:var(--v-ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.virion-page{width:min(760px,calc(100% - 28px));margin:48px auto 72px}
.virion-figure{margin:0}
.virion-plate{position:relative;padding:58px 18px 78px;background:var(--v-card);box-shadow:0 0 0 1px color-mix(in srgb,var(--v-muted) 70%, transparent)}
.virion-corners{position:absolute;inset:16px 18px;pointer-events:none}
.virion-corner{position:absolute;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;color:var(--v-muted);white-space:nowrap}
.virion-corner[data-corner="fig"]{top:0;left:0;color:var(--v-ink)}
.virion-corner[data-corner="title"]{top:0;right:0;letter-spacing:.12em;text-transform:uppercase}
.virion-corner[data-corner="hint"]{left:0;bottom:0;letter-spacing:.08em;text-transform:uppercase;max-width:42%}
.virion-corner[data-corner="readout"]{right:0;bottom:0;color:var(--v-ink);font-size:10.5px;font-variant-numeric:tabular-nums;text-align:right;max-width:68%;white-space:nowrap}
.v-svg{display:block;width:100%;height:auto;overflow:visible}
.v-svg path,.v-svg circle,.v-svg ellipse,.v-svg .v-leader{vector-effect:non-scaling-stroke}
.v-label{font:italic 13px/1.2 Palatino,"Palatino Linotype","Iowan Old Style",Georgia,serif;fill:var(--v-strong)}
.v-leader{fill:none;stroke:var(--v-strong);stroke-width:.85px;stroke-linecap:round;stroke-linejoin:round}
.v-fill{fill:var(--v-paper);stroke:none}
.v-shade{stroke:none}
.v-shade[data-shade="0"]{fill:var(--v-s0)}
.v-shade[data-shade="1"]{fill:var(--v-s1)}
.v-shade[data-shade="2"]{fill:var(--v-s2)}
.v-shade[data-shade="3"]{fill:var(--v-s3)}
.v-solid[data-lit] .v-shade{fill:color-mix(in srgb,var(--v-lit) 34%, var(--v-paper))}
.v-solid[data-lit] .v-edge{stroke:var(--v-lit);stroke-width:1.15px}
.v-edge{fill:none;stroke:var(--v-line);stroke-width:.7px;stroke-linejoin:round;stroke-linecap:round}
.v-edge[data-tone="lo"]{stroke:var(--v-line-dim)}
.v-edge[data-tone="mid"]{stroke:color-mix(in srgb,var(--v-line) 55%, var(--v-line-dim))}
.v-dot{fill:var(--v-dot);stroke:none;opacity:.45}
.v-halo{fill:var(--v-halo);opacity:.28;filter:blur(10px)}
.virion-legend{display:grid;gap:10px;margin-top:14px;color:var(--v-muted);font-size:13.5px}
.virion-keys{display:flex;flex-wrap:wrap;gap:8px 16px}
.virion-key{display:inline-flex;align-items:center;gap:7px}
.virion-swatch{width:14px;height:10px;border:1px solid var(--v-line);background:linear-gradient(#fff0,var(--v-s0));display:inline-block}
.virion-swatch[data-mark="lit"]{background:var(--v-lit);border-color:var(--v-lit)}
.virion-swatch[data-mark="lo"]{background:var(--v-s1)}
.virion-caption{max-width:68ch}
.virion-stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.virion-stages button{font:12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--v-ink);background:transparent;border:0;border-bottom:1px solid transparent;padding:6px 2px;cursor:pointer}
.virion-stages button[aria-pressed="true"]{color:var(--v-strong);border-bottom-color:var(--v-strong)}
.virion-sources{font-size:12px}
.virion-sources a{color:inherit}
.virion-stage{touch-action:none}
@media (max-width:640px){
  .virion-plate{padding:72px 10px 86px}
  .virion-corner[data-corner="readout"]{left:0;right:auto;bottom:22px;text-align:left;white-space:normal;max-width:100%}
  .virion-corner[data-corner="hint"]{bottom:0}
}
@media (prefers-reduced-motion:reduce){.v-halo{filter:none}}

e cell is flattened. The nucleus is 44.4% of the cell volume, the cytoplasm 51.6%, and the mitochondria 3.8%. The readout N is that nuclear share, computed from the two radii drawn here. A film can make the nucleus look like 90% of the area; that is the film, not this sphere. The plasma membrane has about 130% more area than the smooth sphere. Janeway's resting cell has condensed chromatin, a thin rim of cytoplasm, and no rough endoplasmic reticulum. The nucleolus is drawn at 0.9 μm, inside the 0.5–1.4 μm range of those sections. T cells and B cells are not separate shapes under the microscope. Key 2 cuts the cell.</span><span class="virion-stages" data-stages><button type="button" data-stage="0" aria-pressed="false">1 Outside</button><button type="button" data-stage="1" aria-pressed="false">2 Section</button></span><span class="virion-sources"><a href="https://doi.org/10.1182/blood.V56.5.866.866">Schmid-Schönbein et al. 1980</a> · <a href="https://doi.org/10.1152/jappl.1990.69.5.1767">Downey et al. 1990</a> · <a href="https://www.ncbi.nlm.nih.gov/books/NBK27092/figure/A42/">Janeway et al. 2001, Figure 1.5</a></span></figcaption></figure></main><script type="module">const RAD = Math.PI / 180;

function add(a, b) {
  return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
}

function sub(a, b) {
  return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}

function mul(a, s) {
  return [a[0] * s, a[1] * s, a[2] * s];
}

function dot(a, b) {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
}

function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

function len(a) {
  return Math.hypot(a[0], a[1], a[2]);
}

function norm(a) {
  const l = len(a) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function smooth(u, a, b) {
  if (u <= a) return 0;
  if (u >= b) return 1;
  const t = (u - a) / (b - a);
  return t * t * (3 - 2 * t);
}

function camera({ azimuth = 40, elevation = 28, scale = 2.55, origin = [360, 400] } = {}) {
  const a = azimuth * RAD;
  const e = elevation * RAD;
  return {
    azimuth,
    elevation,
    scale,
    origin,
    sinA: Math.sin(a),
    cosA: Math.cos(a),
    sinE: Math.sin(e),
    cosE: Math.cos(e),
  };
}

function project([x, y, z], cam) {
  const { sinA, cosA, sinE, cosE, scale, origin } = cam;
  return [
    origin[0] + (x * sinA - y * cosA) * scale,
    origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * scale,
  ];
}

function depthOf([x, y, z], cam) {
  return (x * cam.cosA + y * cam.sinA) * cam.cosE + z * cam.sinE;
}

function viewDir(cam) {
  return [cam.cosA * cam.cosE, cam.sinA * cam.cosE, cam.sinE];
}

const LIGHT = norm([-0.42, -0.38, 0.82]);

function shadeOf(normal) {
  const t = (dot(norm(normal), LIGHT) + 1) / 2;
  return Math.max(0, Math.min(3, Math.floor(t * 3.999)));
}

function tenth(value) {
  const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
  return text === "-0" ? "0" : text;
}

function pathOf(points, closed = false) {
  if (!points.length) return "";
  const d = points.map(([x, y], i) => `${i ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("");
  return closed ? `${d}Z` : d;
}

function convexHull(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (sorted.length < 3) return sorted;
  const cross2 = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of sorted) {
    while (lower.length >= 2 && cross2(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = sorted.length - 1; i >= 0; i--) {
    const p = sorted[i];
    while (upper.length >= 2 && cross2(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

function fitOrigin(points, cam, width, height, pad = 28) {
  const bare = { ...cam, origin: [0, 0] };
  const projected = points.map((p) => project(p, bare));
  const xs = projected.map((p) => p[0]);
  const ys = projected.map((p) => p[1]);
  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const spanX = maxX - minX || 1;
  const spanY = maxY - minY || 1;
  const scale = Math.min((width - pad * 2) / (spanX / cam.scale), (height - pad * 2) / (spanY / cam.scale));
  const fitted = camera({ azimuth: cam.azimuth, elevation: cam.elevation, scale, origin: [0, 0] });
  const again = points.map((p) => project(p, fitted));
  const xs2 = again.map((p) => p[0]);
  const ys2 = again.map((p) => p[1]);
  const cx = (Math.min(...xs2) + Math.max(...xs2)) / 2;
  const cy = (Math.min(...ys2) + Math.max(...ys2)) / 2;
  fitted.origin = [width / 2 - cx, height / 2 - cy];
  return fitted;
}



function ringPoints(origin, axis, radius, steps) {
  const up = Math.abs(axis[2]) < 0.85 ? [0, 0, 1] : [1, 0, 0];
  const u = norm(cross(axis, up));
  const v = cross(axis, u);
  return Array.from({ length: steps }, (_, i) => {
    const a = (i / steps) * Math.PI * 2;
    return add(origin, add(mul(u, Math.cos(a) * radius), mul(v, Math.sin(a) * radius)));
  });
}

function prism(bottom, top, cam) {
  const count = bottom.length;
  const view = viewDir(cam);
  const shades = [[], [], [], []];
  const projected = [];
  for (let i = 0; i < count; i++) {
    const j = (i + 1) % count;
    const n = norm(cross(sub(bottom[j], bottom[i]), sub(top[i], bottom[i])));
    const face = [bottom[i], bottom[j], top[j], top[i]];
    if (dot(n, view) > 0.02) {
      shades[shadeOf(n)].push(pathOf(face.map((p) => project(p, cam)), true));
    }
    projected.push(project(bottom[i], cam), project(top[i], cam));
  }
  const topN = norm(cross(sub(top[1], top[0]), sub(top[2] || top[0], top[0])));
  if (dot(topN, view) > 0.02) shades[shadeOf(topN)].push(pathOf(top.map((p) => project(p, cam)), true));
  const botN = norm(cross(sub(bottom[1], bottom[0]), sub(bottom[0], bottom[2] || bottom[0])));
  if (dot(botN, view) > 0.02) shades[shadeOf(botN)].push(pathOf(bottom.map((p) => project(p, cam)), true));
  const hull = convexHull(projected);
  const mid = mul(add(bottom[0], top[0]), 0.5);
  return {
    fill: pathOf(hull, true),
    shades: shades.map((parts) => parts.join("")),
    outline: pathOf(hull, true),
    depth: depthOf(mid, cam),
  };
}

function rod(from, to, radius, cam, steps = 12) {
  const axis = norm(sub(to, from));
  if (!Number.isFinite(axis[0]) || lenOrZero(sub(to, from)) < 0.15 || radius < 0.05) return null;
  const bottom = ringPoints(from, axis, radius, steps);
  const top = ringPoints(to, axis, radius, steps);
  const mesh = prism(bottom, top, cam);
  mesh.depth = depthOf(mul(add(from, to), 0.5), cam);
  return mesh;
}

function lenOrZero(a) {
  return Math.hypot(a[0], a[1], a[2]);
}

function box(x, y, w, d, z, h, cam) {
  const bottom = [
    [x, y, z],
    [x + w, y, z],
    [x + w, y + d, z],
    [x, y + d, z],
  ];
  const top = bottom.map((p) => [p[0], p[1], z + h]);
  const mesh = prism(bottom, top, cam);
  mesh.depth = depthOf([x + w / 2, y + d / 2, z + h / 2], cam);
  return mesh;
}

function sphere(center, radius, cam, { bands = 11, skipBottom = 0, spread = 0 } = {}) {
  const meshes = [];
  for (let i = 0; i < bands; i++) {
    const t0 = i / bands;
    const t1 = (i + 1) / bands;
    if (t1 <= skipBottom) continue;
    const lat0 = -Math.PI / 2 + Math.PI * Math.max(t0, skipBottom);
    const lat1 = -Math.PI / 2 + Math.PI * t1;
    const mid = (lat0 + lat1) / 2;
    const r = Math.max(0.4, Math.cos(mid) * radius);
    const z0 = center[2] + Math.sin(lat0) * radius + Math.sin(lat0) * spread;
    const z1 = center[2] + Math.sin(lat1) * radius + Math.sin(lat1) * spread;
    const mesh = rod([center[0], center[1], Math.min(z0, z1)], [center[0], center[1], Math.max(z0, z1)], r, cam, 18);
    if (mesh) meshes.push(mesh);
  }
  return meshes;
}

function solidSvg(mesh, { tone = "mid", lit = false, edge = true } = {}) {
  if (!mesh?.fill) return "";
  const shades = mesh.shades.map((d, i) => (d ? `<path class="v-shade" data-shade="${i}" d="${d}"/>` : "")).join("");
  const stroke = edge ? `<path class="v-edge" data-tone="${tone}" d="${mesh.outline}"/>` : "";
  return `<g class="v-solid"${lit ? ' data-lit=""' : ""}><path class="v-fill" d="${mesh.fill}"/>${shades}${stroke}</g>`;
}

function ball(center, radius, cam, { bands = 18, steps = 22 } = {}) {
  const shades = [[], [], [], []];
  const view = viewDir(cam);
  const samples = [];
  const ringAt = (lat) => Array.from({ length: steps }, (_, i) => {
    const a = (i / steps) * Math.PI * 2;
    const r = Math.cos(lat) * radius;
    return [center[0] + Math.cos(a) * r, center[1] + Math.sin(a) * r, center[2] + Math.sin(lat) * radius];
  });
  for (let band = 0; band < bands; band++) {
    const lat0 = -Math.PI / 2 + (Math.PI * band) / bands;
    const lat1 = -Math.PI / 2 + (Math.PI * (band + 1)) / bands;
    const bottom = ringAt(lat0);
    const top = ringAt(lat1);
    for (let i = 0; i < steps; i++) {
      const j = (i + 1) % steps;
      const n = norm(cross(sub(bottom[j], bottom[i]), sub(top[i], bottom[i])));
      if (dot(n, view) <= 0.04) continue;
      shades[shadeOf(n)].push(pathOf([bottom[i], bottom[j], top[j], top[i]].map((p) => project(p, cam)), true));
    }
    if (band % 2 === 0) samples.push(...bottom);
  }
  samples.push([center[0], center[1], center[2] + radius], [center[0], center[1], center[2] - radius]);
  const hull = convexHull(samples.map((p) => project(p, cam)));
  return {
    fill: pathOf(hull, true),
    shades: shades.map((parts) => parts.join("")),
    outline: pathOf(hull, true),
    depth: depthOf(center, cam),
  };
}

function dotSvg(point, cam, size, tone = "lo") {
  const [x, y] = project(point, cam);
  return `<circle class="v-dot" data-tone="${tone}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}"/>`;
}

function haloSvg(center, rx, ry, cam) {
  const [cx, cy] = project(center, cam);
  const [ex] = project([center[0] + rx, center[1], center[2]], cam);
  const [, ey] = project([center[0], center[1] + ry, center[2]], cam);
  const sx = Math.max(8, Math.hypot(ex - cx, 0));
  const sy = Math.max(6, Math.abs(ey - cy));
  return `<ellipse class="v-halo" cx="${cx.toFixed(1)}" cy="${(cy + 8).toFixed(1)}" rx="${sx.toFixed(1)}" ry="${sy.toFixed(1)}"/>`;
}

function sortItems(items) {
  return items.filter(Boolean).sort((a, b) => a.depth - b.depth);
}

function paintItem(mesh, style) {
  if (!mesh) return null;
  return { depth: mesh.depth, svg: solidSvg(mesh, style) };
}

function xml(text) {
  return String(text).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
}

function leadersSvg(labels, { width, height, gutter = 148 } = {}) {
  const left = [];
  const right = [];
  for (const label of labels) {
    if (!Number.isFinite(label.x) || !Number.isFinite(label.y)) continue;
    (label.x < width / 2 ? left : right).push(label);
  }
  left.sort((a, b) => a.y - b.y);
  right.sort((a, b) => a.y - b.y);
  const place = (items) => {
    const gap = 32;
    const top = 36;
    const bottom = height - 20;
    const rows = [];
    for (const item of items) {
      const previous = rows.length ? rows[rows.length - 1] : top - gap;
      rows.push(Math.max(previous + gap, Math.min(item.y, bottom)));
    }
    const overflow = rows.length ? rows[rows.length - 1] - bottom : 0;
    if (overflow > 0) {
      for (let i = 0; i < rows.length; i++) rows[i] = Math.max(top, rows[i] - overflow);
    }
    return rows;
  };
  const leftY = place(left);
  const rightY = place(right);
  const row = (item, y, side) => {
    const widthOf = Math.max(48, item.name.length * 6.2);
    const textX = side === "left" ? 16 : width - 16;
    const inner = side === "left" ? Math.min(gutter - 10, 16 + widthOf + 8) : Math.max(width - gutter + 10, width - 16 - widthOf - 8);
    const yLine = y - 4;
    const elbow = side === "left" ? inner + 14 : inner - 14;
    const crossed = side === "left" ? item.x < elbow + 8 : item.x > elbow - 8;
    const d = crossed
      ? `M${inner.toFixed(1)} ${yLine.toFixed(1)}L${item.x.toFixed(1)} ${item.y.toFixed(1)}`
      : `M${inner.toFixed(1)} ${yLine.toFixed(1)}L${elbow.toFixed(1)} ${yLine.toFixed(1)}L${item.x.toFixed(1)} ${item.y.toFixed(1)}`;
    const anchor = side === "left" ? "start" : "end";
    return `<text class="v-label" x="${textX}" y="${y.toFixed(1)}" text-anchor="${anchor}">${xml(item.name)}</text><path class="v-leader" d="${d}"/>`;
  };
  return `${left.map((item, i) => row(item, leftY[i], "left")).join("")}${right.map((item, i) => row(item, rightY[i], "right")).join("")}`;
}




function triad(axis) {
  const up = Math.abs(axis[2]) < 0.85 ? [0, 0, 1] : [1, 0, 0];
  const u = norm([axis[1] * up[2] - axis[2] * up[1], axis[2] * up[0] - axis[0] * up[2], axis[0] * up[1] - axis[1] * up[0]]);
  const v = [
    axis[1] * u[2] - axis[2] * u[1],
    axis[2] * u[0] - axis[0] * u[2],
    axis[0] * u[1] - axis[1] * u[0],
  ];
  return { u, v };
}

function feet(count, radius, axis) {
  const { u, v } = triad(axis);
  return Array.from({ length: count }, (_, i) => {
    const a = (i / count) * Math.PI * 2 + 0.4;
    return add(mul(u, Math.cos(a) * radius), mul(v, Math.sin(a) * radius));
  });
}

function membraneTile(tile, cam, { tone = "mid", edge = false } = {}) {
  const mesh = box(tile.x, tile.y, tile.w, tile.d, tile.z, tile.h, cam);
  const mark = dotSvg([tile.cx, tile.cy, tile.z + tile.h], cam, 0.9, "lo");
  const painted = paintItem(mesh, { tone, edge });
  if (!painted) return [];
  return [painted, { depth: mesh.depth + 0.02, svg: mark }];
}

function glycoprotein(base, height, headR, cam, { tone = "hi", lit = false, lobes = 1 } = {}) {
  const top = [base[0], base[1], base[2] + height];
  const items = [paintItem(rod(base, top, 1.15, cam, 8), { tone, lit })];
  if (headR > 0.25) {
    const head = add(top, [0, 0, headR * 0.65]);
    for (const mesh of sphere(head, headR, cam, { bands: 5 })) items.push(paintItem(mesh, { tone, lit }));
    if (lobes > 1) {
      for (const offset of feet(lobes, headR * 0.85, [0, 0, 1])) {
        const at = add(head, offset);
        for (const mesh of sphere(at, headR * 0.55, cam, { bands: 3 })) items.push(paintItem(mesh, { tone: "hi", lit }));
      }
    }
  }
  return items;
}

function spike(anchor, dir, { length, head, stalk, lobes, fusion = 0, peptide = 0, spread = 2.2 }, cam, { tone = "hi", lit = false } = {}) {
  const axis = norm(dir);
  const neck = add(anchor, mul(axis, Math.max(0.8, length - head * 0.8)));
  const tip = add(anchor, mul(axis, length));
  const items = [];
  for (const offset of feet(lobes, spread, axis)) {
    const from = add(anchor, offset);
    const to = add(neck, mul(offset, 0.25));
    items.push(paintItem(rod(from, to, stalk, cam, 7), { tone, lit }));
  }
  for (const mesh of sphere(tip, head * (1 - fusion * 0.18), cam, { bands: 5 })) {
    items.push(paintItem(mesh, { tone, lit }));
  }
  if (peptide > 0.4) {
    const end = add(tip, mul(axis, peptide));
    items.push(paintItem(rod(tip, end, Math.max(0.45, stalk * 0.55), cam, 6), { tone, lit }));
  }
  return items;
}

function envelope(center, radius, cam, { skipBottom = 0, spread = 0, cutaway = false, tone = "mid", lit = false, bands = 12 } = {}) {
  if (spread < 0.8 && !cutaway) return [paintItem(ball(center, radius, cam), { tone, lit })];
  const painted = sphere(center, radius, cam, { bands, skipBottom, spread }).map((mesh) => paintItem(mesh, { tone, lit })).filter(Boolean);
  if (!cutaway) return painted;
  const ordered = [...painted].sort((a, b) => a.depth - b.depth);
  return ordered.slice(0, Math.max(3, Math.ceil(ordered.length * 0.68)));
}

function rnpRod(from, to, cam, { lit = false } = {}) {
  const axis = norm(sub(to, from));
  const length = Math.hypot(to[0] - from[0], to[1] - from[1], to[2] - from[2]);
  const items = [paintItem(rod(from, to, 2.1, cam, 8), { tone: "hi", lit })];
  const turns = Math.max(2, Math.round(length / 7));
  for (let i = 1; i < turns; i++) {
    const at = add(from, mul(axis, (length * i) / turns));
    items.push(paintItem(rod(add(at, mul(axis, -0.35)), add(at, mul(axis, 0.35)), 2.55, cam, 8), { tone: "mid", lit }));
  }
  items.push(paintItem(rod(from, add(from, mul(axis, 1.2)), 2.8, cam, 8), { tone: "hi", lit }));
  return items;
}

const FACTS = {
  schmid: {
    url: "https://doi.org/10.1182/blood.V56.5.866.866",
    pubmed: "6775712",
    journal: "Blood, 1 November 1980",
    temDiameterUm: 6.2,
    lightDiameterUm: 5.75,
    volumeUm3: 125,
    volumeSdUm3: 15,
    nucleusFraction: 0.444,
    cytoplasmFraction: 0.516,
    mitochondriaFraction: 0.038,
    granulesFraction: 0.002,
    excessMembrane: 1.3,
  },
  downey: {
    url: "https://doi.org/10.1152/jappl.1990.69.5.1767",
    pubmed: "2272970",
    opticalDiameterUm: 6.05,
    opticalRangeUm: [5.98, 6.09],
  },
  janeway: {
    url: "https://www.ncbi.nlm.nih.gov/books/NBK27092/figure/A42/",
    book: "Janeway, Travers, Walport, Shlomchik. Immunobiology, 5th edition, 2001. Figure 1.5",
  },
  film: {
    url: "https://www.ncbi.nlm.nih.gov/books/NBK560905/",
    smearDiameterUm: [6, 9],
  },
  section: {
    url: "https://oncohemakey.com/the-structure-of-lymphocytes-and-plasma-cells/",
    nucleolusUm: [0.5, 1.4],
    filmNucleusArea: 0.9,
  },
  nucleolusDrawnUm: 0.9,
};




const R = FACTS.schmid.temDiameterUm / 2;
const NUCLEUS_R = R * Math.cbrt(FACTS.schmid.nucleusFraction);
const NUCLEUS_AT = [-0.22, 0.04, 0];
const VILLUS = 0.38;
const GOLD = Math.PI * (3 - Math.sqrt(5));

const STAGES = [
  { id: "outside", label: "Outside", at: 0, key: "1" },
  { id: "section", label: "Section", at: 1, key: "2" },
];

const VIEW = { width: 720, height: 560 };
const GUTTER = 150;

const FRAME = [
  [-3.7, -3.7, -3.7],
  [3.7, 3.7, -3.7],
  [-3.7, -3.7, 3.7],
  [3.7, 3.7, 3.7],
];

function plateCamera(cam) {
  const fitted = fitOrigin(FRAME, cam, VIEW.width - GUTTER * 2, VIEW.height, 16);
  fitted.origin = [fitted.origin[0] + GUTTER, fitted.origin[1]];
  return fitted;
}

function sphereDirs(count) {
  return Array.from({ length: count }, (_, i) => {
    const z = count === 1 ? 0 : 1 - (i / (count - 1)) * 2;
    const radius = Math.sqrt(Math.max(0, 1 - z * z));
    const t = GOLD * i;
    return [Math.cos(t) * radius, Math.sin(t) * radius, z];
  });
}

function chromatin(nucleusAt, nucleusR) {
  const count = 8;
  return Array.from({ length: count }, (_, i) => {
    const a = (i / count) * Math.PI * 2 + 0.63;
    const at = add(nucleusAt, [Math.cos(a) * nucleusR * 0.76, Math.sin(a) * nucleusR * 0.76, 0.22]);
    return { at, r: 0.34 };
  });
}

function mitochondria(cellR, nucleusAt, nucleusR) {
  const angles = [-0.55, 0.2, 0.85];
  return angles.map((angle) => {
    const dir = [Math.cos(angle), Math.sin(angle), 0];
    const b = -2 * (dir[0] * nucleusAt[0] + dir[1] * nucleusAt[1]);
    const c = nucleusAt[0] ** 2 + nucleusAt[1] ** 2 - nucleusR ** 2;
    const outer = (-b + Math.sqrt(b * b - 4 * c)) / 2;
    const mid = (outer + cellR) / 2;
    const at = [dir[0] * mid, dir[1] * mid, 0.1];
    const tangent = [-dir[1], dir[0], 0];
    const half = 0.36;
    return {
      at,
      from: [at[0] - tangent[0] * half, at[1] - tangent[1] * half, at[2]],
      to: [at[0] + tangent[0] * half, at[1] + tangent[1] * half, at[2]],
      r: 0.24,
    };
  });
}

function pose(u, { azimuth = -18, elevation = 58, explode = 0 } = {}) {
  const t = Math.max(0, Math.min(1, u));
  const cam = camera({ azimuth, elevation, scale: 2.7 });
  const fitted = plateCamera(cam);
  const view = viewDir(cam);
  const section = t > 0.5 || explode > 0.5;
  const center = [0, 0, 0];
  const nucleusAt = NUCLEUS_AT;
  const nucleusR = NUCLEUS_R;
  const blocks = chromatin(nucleusAt, nucleusR);
  const mitos = mitochondria(R, nucleusAt, nucleusR);
  const nucleolus = {
    at: add(nucleusAt, [0.5, 0.28, 0.14]),
    r: FACTS.nucleolusDrawnUm / 2,
  };
  const villi = sphereDirs(28).map((dir) => ({
    dir,
    anchor: mul(dir, R * 0.98),
    tip: mul(dir, R + VILLUS),
    draw: false,
  }));
  if (!section) {
    const kept = [];
    for (const villus of villi) {
      const facing = villus.dir[0] * view[0] + villus.dir[1] * view[1] + villus.dir[2] * view[2];
      if (facing < 0.18) continue;
      const [x, y] = project(villus.tip, fitted);
      const clear = kept.every((other) => Math.hypot(other.x - x, other.y - y) > 26);
      if (!clear) continue;
      villus.draw = true;
      kept.push({ x, y });
    }
  }
  const fraction = (nucleusR / R) ** 3;
  const shownV = villi.filter((villus) => villus.draw).length;
  const readout = section ? `N ${Math.round(fraction * 100)}%` : `${FACTS.schmid.temDiameterUm} μm`;
  return {
    t,
    section,
    center,
    radius: R,
    nucleusAt,
    nucleusR,
    blocks,
    mitos,
    nucleolus,
    villi,
    shownV,
    fraction,
    readout,
    cam,
    azimuth,
    elevation,
  };
}







function quadMesh(face, cam) {
  const path = pathOf(face.map((p) => project(p, cam)), true);
  const mid = mul(face.reduce((sum, p) => add(sum, p), [0, 0, 0]), 0.25);
  return { fill: path, shades: ["", path, "", ""], outline: path, depth: depthOf(mid, cam) };
}

function disk(center, radius, cam, shade = 1) {
  const steps = 40;
  const items = [];
  for (let i = 0; i < steps; i++) {
    const a0 = (i / steps) * Math.PI * 2;
    const a1 = ((i + 1) / steps) * Math.PI * 2;
    const face = [
      center,
      [center[0] + Math.cos(a0) * radius, center[1] + Math.sin(a0) * radius, center[2]],
      [center[0] + Math.cos(a1) * radius, center[1] + Math.sin(a1) * radius, center[2]],
      [center[0] + Math.cos(a1) * radius, center[1] + Math.sin(a1) * radius, center[2]],
    ];
    const mesh = quadMesh(face, cam);
    const shades = ["", "", "", ""];
    shades[shade] = mesh.fill;
    mesh.shades = shades;
    const painted = paintItem(mesh, { tone: shade < 2 ? "mid" : "lo", edge: false });
    if (painted) items.push(painted);
  }
  return items;
}

function screenOf(point, cam) {
  const [x, y] = project(point, cam);
  return { x, y };
}

function apart(point, others) {
  let best = Infinity;
  for (const other of others) best = Math.min(best, Math.hypot(point.x - other.x, point.y - other.y));
  return best;
}

function rayClear(point, obstacles) {
  const side = point.x < VIEW.width / 2 ? "left" : "right";
  const margin = side === "left" ? 140 : VIEW.width - 140;
  let clear = 80;
  for (const other of obstacles) {
    if (Math.hypot(other.x - point.x, other.y - point.y) < 3) continue;
    const between = side === "left" ? other.x > margin && other.x < point.x - 7 : other.x < margin && other.x > point.x + 7;
    if (!between) continue;
    clear = Math.min(clear, Math.abs(other.y - point.y));
  }
  return clear;
}

function takeNames(picks) {
  const taken = [];
  const width = VIEW.width;
  for (const pick of picks) {
    const ranked = pick.candidates.slice().sort((a, b) => pick.score(b) - pick.score(a));
    const fits = (cand) => taken.every((other) => {
      const sameSide = (cand.x < width / 2) === (other.x < width / 2);
      if (sameSide && Math.abs(cand.y - other.y) < 36) return false;
      return Math.hypot(cand.x - other.x, cand.y - other.y) >= 24;
    });
    const separated = (cand) => Math.min(...taken.map((other) => Math.hypot(other.x - cand.x, other.y - cand.y)), Infinity);
    const cand = ranked.find(fits) || ranked.slice().sort((a, b) => separated(b) - separated(a))[0];
    if (cand) taken.push({ name: pick.name, x: cand.x, y: cand.y });
  }
  return taken;
}

function plateNames(state, cam) {
  if (state.section) {
    const wall = Array.from({ length: 72 }, (_, i) => {
      const a = (i / 72) * Math.PI * 2;
      return screenOf([Math.cos(a) * state.radius * 0.99, Math.sin(a) * state.radius * 0.99, 0.02], cam);
    });
    const rim = [];
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const dir = [Math.cos(a), Math.sin(a), 0];
      const b = -2 * (dir[0] * state.nucleusAt[0] + dir[1] * state.nucleusAt[1]);
      const c = state.nucleusAt[0] ** 2 + state.nucleusAt[1] ** 2 - state.nucleusR ** 2;
      const outer = (-b + Math.sqrt(Math.max(0, b * b - 4 * c))) / 2;
      const mid = (outer + state.radius) / 2;
      if (mid > outer + 0.12) rim.push(screenOf([dir[0] * mid, dir[1] * mid, 0.08], cam));
    }
    const blocks = state.blocks.map((block) => screenOf(block.at, cam));
    const mitos = state.mitos.map((mito) => screenOf(mito.at, cam));
    const nucleolus = screenOf(state.nucleolus.at, cam);
    const nucleus = [];
    for (const scale of [0.34, 0.5]) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2 + 0.4;
        const at = add(state.nucleusAt, [Math.cos(a) * state.nucleusR * scale, Math.sin(a) * state.nucleusR * scale, 0.16]);
        nucleus.push(screenOf(at, cam));
      }
    }
    return takeNames([
      { name: "Heterochromatin", candidates: blocks, score: (p) => apart(p, [nucleolus, ...mitos]) },
      { name: "Nucleolus", candidates: [nucleolus], score: () => 1 },
      { name: "Mitochondrion", candidates: mitos, score: (p) => apart(p, blocks) },
      { name: "Nucleus", candidates: nucleus, score: (p) => apart(p, [nucleolus, ...blocks]) },
      { name: "Cytoplasm", candidates: rim, score: (p) => apart(p, [...blocks, ...mitos, nucleolus]) },
      { name: "Plasma membrane", candidates: wall, score: (p) => apart(p, [...blocks, ...mitos, ...rim]) + rayClear(p, [...blocks, ...mitos]) },
    ]);
  }
  const view = viewDir(state.cam);
  const right = norm(cross(view, Math.abs(view[2]) < 0.9 ? [0, 0, 1] : [1, 0, 0]));
  const lift = norm(cross(right, view));
  const tips = state.villi.filter((villus) => villus.draw).map((villus) => screenOf(villus.tip, cam));
  const origin = screenOf(state.center, cam);
  const limb = Array.from({ length: 72 }, (_, i) => {
    const a = (i / 72) * Math.PI * 2;
    const dir = norm(add(mul(right, Math.cos(a)), mul(lift, Math.sin(a))));
    const edge = screenOf(add(state.center, mul(dir, state.radius * 0.98)), cam);
    return { x: edge.x * 0.86 + origin.x * 0.14, y: edge.y * 0.86 + origin.y * 0.14 };
  });
  return takeNames([
    { name: "Microvillus", candidates: tips, score: (p) => rayClear(p, tips) + apart(p, limb) },
    { name: "Plasma membrane", candidates: limb, score: (p) => apart(p, tips) },
  ]);
}

function sceneSvg(state) {
  const cam = plateCamera(state.cam);
  const items = [];
  if (state.section) {
    items.push(...disk([state.center[0], state.center[1], 0], state.radius, cam, 1).map((item) => ({ ...item, depth: item.depth - 4 })));
    const nucleus = [state.nucleusAt[0], state.nucleusAt[1], 0.02];
    items.push(...disk(nucleus, state.nucleusR, cam, 3).map((item) => ({ ...item, depth: item.depth - 2 })));
    for (const mito of state.mitos) {
      const item = paintItem(rod(mito.from, mito.to, mito.r, cam, 8), { tone: "hi" });
      if (item) items.push({ ...item, depth: item.depth + 1 });
    }
    for (const block of state.blocks) {
      const item = paintItem(ball(block.at, block.r, cam, { bands: 8, steps: 12 }), { tone: "hi", lit: true });
      if (item) items.push({ ...item, depth: item.depth + 3 });
    }
    const nucleolusMesh = ball(state.nucleolus.at, state.nucleolus.r, cam, { bands: 10, steps: 14 });
    const nucleolusSvg = solidSvg(nucleolusMesh, { tone: "mid" })
      .replace('class="v-fill"', 'class="v-shade" data-shade="0"')
      .replaceAll('data-shade="3"', 'data-shade="1"')
      .replaceAll('data-shade="2"', 'data-shade="0"');
    if (nucleolusSvg) items.push({ depth: nucleolusMesh.depth + 3, svg: nucleolusSvg });
  } else {
    items.push(...envelope(state.center, state.radius, cam, { tone: "mid" }));
    for (const villus of state.villi) {
      if (!villus.draw) continue;
      items.push(paintItem(rod(villus.anchor, villus.tip, 0.15, cam, 7), { tone: "hi", lit: true }));
    }
  }
  const body = sortItems(items.filter(Boolean)).map((item) => item.svg).join("");
  const names = leadersSvg(plateNames(state, cam), { width: VIEW.width, height: VIEW.height, gutter: GUTTER });
  const label = "A resting small lymphocyte. Italic names in the margin lead to the plasma membrane, and in the cut to the cytoplasm, the nucleus, the heterochromatin, the nucleolus, and a mitochondrion.";
  return `<svg class="v-svg" viewBox="0 0 ${VIEW.width} ${VIEW.height}" role="img" aria-label="${label}">${body}${names}</svg>`;
}

function captionText() {
  const s = FACTS.schmid;
  const film = FACTS.film;
  return `One resting small lymphocyte from human blood. Schmid-Schönbein, Shih, and Chien measured the undeformed cell at ${s.temDiameterUm} μm by transmission electron microscopy, and ${s.lightDiameterUm} μm by light microscopy. The isotonic volume on their figure is ${s.volumeUm3} ± ${s.volumeSdUm3} μm³. Downey et al. measured an optical diameter of ${FACTS.downey.opticalDiameterUm} μm. On a blood film the small lymphocyte is ${film.smearDiameterUm[0]}–${film.smearDiameterUm[1]} μm, because the cell is flattened. The nucleus is ${Math.round(s.nucleusFraction * 1000) / 10}% of the cell volume, the cytoplasm ${Math.round(s.cytoplasmFraction * 1000) / 10}%, and the mitochondria ${Math.round(s.mitochondriaFraction * 1000) / 10}%. The readout N is that nuclear share, computed from the two radii drawn here. A film can make the nucleus look like ${Math.round(FACTS.section.filmNucleusArea * 100)}% of the area; that is the film, not this sphere. The plasma membrane has about ${Math.round(s.excessMembrane * 100)}% more area than the smooth sphere. Janeway's resting cell has condensed chromatin, a thin rim of cytoplasm, and no rough endoplasmic reticulum. The nucleolus is drawn at ${FACTS.nucleolusDrawnUm} μm, inside the ${FACTS.section.nucleolusUm[0]}–${FACTS.section.nucleolusUm[1]} μm range of those sections. T cells and B cells are not separate shapes under the microscope. Key 2 cuts the cell.`;
}


const stageEl = document.querySelector("[data-stagebox]");
const sceneHost = document.querySelector("[data-scene]");
const readout = document.querySelector("[data-readout]");
const buttons = [...document.querySelectorAll("[data-stage]")];
const still = matchMedia("(prefers-reduced-motion: reduce)");
let azimuth = -18;
let elevation = 58;
let u = 0;
let target = u;
let explode = 0;
let explodeTarget = 0;
let speed = 1;
let playing = !still.matches;
let last = 0;
let frame = 0;
let idle = 0;
let drag = null;
function follow(current, next, dt, seconds) {
  if (still.matches || seconds <= 0) return next;
  const step = 1 - Math.exp(-dt / seconds);
  return current + (next - current) * step;
}
function nearest(value) {
  return STAGES.reduce((best, stage) => Math.abs(stage.at - value) < Math.abs(best.at - value) ? stage : best);
}
function render() {
  const state = pose(u, { azimuth, elevation, explode });
  sceneHost.innerHTML = sceneSvg(state);
  if (readout.textContent !== state.readout) readout.textContent = state.readout;
  const here = nearest(state.t);
  for (const button of buttons) button.setAttribute("aria-pressed", String(button.dataset.stage === String(here.at) && !playing));
  stageEl.setAttribute("aria-valuetext", state.readout);
}
function tick(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
  last = now;
  if (playing) target += dt * 0.18 * speed;
  if (target > 1.02) target = 0;
  u = follow(u, target, dt, playing ? 0.08 : 0.45);
  explode = follow(explode, explodeTarget, dt, 0.4);
  render();
  const settled = !playing && Math.abs(u - target) < 0.004 && Math.abs(explode - explodeTarget) < 0.004;
  frame = settled ? 0 : requestAnimationFrame(tick);
}
function wake() {
  if (!frame) { last = 0; frame = requestAnimationFrame(tick); }
}
function hold(next, play) {
  playing = Boolean(play) && !still.matches;
  target = next;
  clearTimeout(idle);
  idle = setTimeout(() => { if (!still.matches) { playing = true; wake(); } }, 8000);
  wake();
}
stageEl.addEventListener("pointerdown", (event) => {
  drag = { x: event.clientX, y: event.clientY, azimuth, elevation, moved: false };
  stageEl.setPointerCapture(event.pointerId);
  hold(target, false);
});
stageEl.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (Math.hypot(dx, dy) > 3) drag.moved = true;
  azimuth = drag.azimuth + dx * 0.35;
  elevation = Math.max(18, Math.min(62, drag.elevation - dy * 0.12));
  wake();
});
function endDrag() { drag = null; }
stageEl.addEventListener("pointerup", endDrag);
stageEl.addEventListener("pointercancel", endDrag);
stageEl.addEventListener("keydown", (event) => {
  const order = STAGES.map((stage) => stage.at);
  const here = nearest(target).at;
  const index = Math.max(0, order.indexOf(here));
  const lastKey = String(order.length);
  if (event.key >= "1" && event.key <= lastKey) hold(order[Number(event.key) - 1], false);
  else if (event.key === "ArrowRight") hold(order[Math.min(order.length - 1, index + 1)], false);
  else if (event.key === "ArrowLeft") hold(order[Math.max(0, index - 1)], false);
  else if (event.key === " ") { event.preventDefault(); hold(target, !playing); }
  else if (event.key === "e" || event.key === "E") { explodeTarget = explodeTarget > 0.5 ? 0 : 1; wake(); }
  else if (event.key === "[") speed = Math.max(0.25, speed / 1.6);
  else if (event.key === "]") speed = Math.min(3, speed * 1.6);
  else return;
  event.preventDefault();
});
for (const button of buttons) {
  button.addEventListener("click", () => hold(Number(button.dataset.stage), false));
}
render();
if (playing) wake();
</script></body></html>
