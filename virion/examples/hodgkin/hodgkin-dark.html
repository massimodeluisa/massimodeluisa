:root, .virion[data-theme="dark"]{

}
.virion[data-theme="light"]{
  --v-page:#efeee8; --v-card:#fbfbf8; --v-ink:#5c5b56; --v-strong:#1c1c18; --v-muted:#8a8982;

*{box-sizing:border-box}
body{margin:0;background:var(--v-page);color:var(--v-ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.virion-page{width:min(760px,calc(100% - 28px));margin:48px auto 72px}
.virion-figure{margin:0}
.virion-plate{position:relative;padding:58px 18px 78px;background:var(--v-card);box-shadow:0 0 0 1px color-mix(in srgb,var(--v-muted) 70%, transparent)}
.virion-corners{position:absolute;inset:16px 18px;pointer-events:none}
.virion-corner{position:absolute;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;color:var(--v-muted);white-space:nowrap}
.virion-corner[data-corner="fig"]{top:0;left:0;color:var(--v-ink)}
.virion-corner[data-corner="title"]{top:0;right:0;letter-spacing:.12em;text-transform:uppercase}
.virion-corner[data-corner="hint"]{left:0;bottom:0;letter-spacing:.08em;text-transform:uppercase;max-width:42%}
.virion-corner[data-corner="readout"]{right:0;bottom:0;color:var(--v-ink);font-size:10.5px;font-variant-numeric:tabular-nums;text-align:right;max-width:68%;white-space:nowrap}
.v-svg{display:block;width:100%;height:auto;overflow:visible}
.v-svg path,.v-svg circle,.v-svg ellipse{vector-effect:non-scaling-stroke}
.v-fill{fill:var(--v-paper);stroke:none}
.v-shade{stroke:none}
.v-shade[data-shade="0"]{fill:var(--v-s0)}
.v-shade[data-shade="1"]{fill:var(--v-s1)}
.v-shade[data-shade="2"]{fill:var(--v-s2)}
.v-shade[data-shade="3"]{fill:var(--v-s3)}
.v-solid[data-lit] .v-shade{fill:color-mix(in srgb,var(--v-lit) 34%, var(--v-paper))}
.v-solid[data-lit] .v-edge{stroke:var(--v-lit);stroke-width:1.15px}
.v-edge{fill:none;stroke:var(--v-line);stroke-width:.7px;stroke-linejoin:round;stroke-linecap:round}
.v-edge[data-tone="lo"]{stroke:var(--v-line-dim)}
.v-edge[data-tone="mid"]{stroke:color-mix(in srgb,var(--v-line) 55%, var(--v-line-dim))}
.v-dot{fill:var(--v-dot);stroke:none;opacity:.45}
.v-halo{fill:var(--v-halo);opacity:.28;filter:blur(10px)}
.virion-legend{display:grid;gap:10px;margin-top:14px;color:var(--v-muted);font-size:13.5px}
.virion-keys{display:flex;flex-wrap:wrap;gap:8px 16px}
.virion-key{display:inline-flex;align-items:center;gap:7px}
.virion-swatch{width:14px;height:10px;border:1px solid var(--v-line);background:linear-gradient(#fff0,var(--v-s0));display:inline-block}
.virion-swatch[data-mark="lit"]{background:var(--v-lit);border-color:var(--v-lit)}
.virion-swatch[data-mark="lo"]{background:var(--v-s1)}
.virion-caption{max-width:68ch}
.virion-stages{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.virion-stages button{font:12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--v-ink);background:transparent;border:0;border-bottom:1px solid transparent;padding:6px 2px;cursor:pointer}
.virion-stages button[aria-pressed="true"]{color:var(--v-strong);border-bottom-color:var(--v-strong)}
.virion-sources{font-size:12px}
.virion-sources a{color:inherit}
.virion-stage{touch-action:none}
@media (max-width:640px){
  .virion-plate{padding:72px 10px 86px}
  .virion-corner[data-corner="readout"]{left:0;right:auto;bottom:22px;text-align:left;white-space:normal;max-width:100%}
  .virion-corner[data-corner="hint"]{bottom:0}
}
@media (prefers-reduced-motion:reduce){.v-halo{filter:none}}

ath class="v-fill" d="M366.4 235.3L387.9 221.4L417.9 229L417.9 248.4L396.5 262.3L366.4 254.7Z"/><path class="v-shade" data-shade="1" d="M396.5 262.3L366.4 254.7L366.4 235.3L396.5 242.9Z"/><path class="v-shade" data-shade="2" d="M417.9 248.4L396.5 262.3L396.5 242.9L417.9 229Z"/><path class="v-shade" data-shade="3" d="M417.9 229L396.5 242.9L366.4 235.3L387.9 221.4Z"/><path class="v-edge" data-tone="mid" d="M366.4 235.3L387.9 221.4L417.9 229L417.9 248.4L396.5 262.3L366.4 254.7Z"/></g><circle class="v-dot" data-tone="lo" cx="392.2" cy="232.1" r="0.9"/><g class="v-solid"><path class="v-fill" d="M233.5 240.3L255 226.4L285 234L285 253.4L263.5 267.4L233.5 259.7Z"/><path class="v-shade" data-shade="1" d="M263.5 267.4L233.5 259.7L233.5 240.3L263.5 248Z"/><path class="v-shade" data-shade="2" d="M285 253.4L263.5 267.4L263.5 248L285 234Z"/><path class="v-shade" data-shade="3" d="M285 234L263.5 248L233.5 240.3L255 226.4Z"/><path class="v-edge" data-tone="mid" d="M233.5 240.3L255 226.4L285 234L285 253.4L263.5 267.4L233.5 259.7Z"/></g><circle class="v-dot" data-tone="lo" cx="259.3" cy="237.2" r="0.9"/><g class="v-solid"><path class="v-fill" d="M315 241.6L336.4 227.7L366.4 235.3L366.4 254.7L345 268.7L315 261Z"/><path class="v-shade" data-shade="1" d="M345 268.7L315 261L315 241.6L345 249.3Z"/><path class="v-shade" data-shade="2" d="M366.4 254.7L345 268.7L345 249.3L366.4 235.3Z"/><path class="v-shade" data-shade="3" d="M366.4 235.3L345 249.3L315 241.6L336.4 227.7Z"/></g><circle class="v-dot" data-tone="lo" cx="340.7" cy="238.5" r="0.9"/><g class="v-solid"><path class="v-fill" d="M263.5 248L285 234L315 241.6L315 261L293.6 275L263.5 267.4Z"/><path class="v-shade" data-shade="1" d="M293.6 275L263.5 267.4L263.5 248L293.6 255.6Z"/><path class="v-shade" data-shade="2" d="M315 261L293.6 275L293.6 255.6L315 241.6Z"/><path class="v-shade" data-shade="3" d="M315 241.6L293.6 255.6L263.5 248L285 234Z"/><path class="v-edge" data-tone="mid" d="M263.5 248L285 234L315 241.6L315 261L293.6 275L263.5 267.4Z"/></g><circle class="v-dot" data-tone="lo" cx="289.3" cy="244.8" r="0.9"/><g class="v-solid"><path class="v-fill" d="M345 249.3L366.4 235.3L396.5 242.9L396.5 262.3L375 276.3L345 268.7Z"/><path class="v-shade" data-shade="1" d="M375 276.3L345 268.7L345 249.3L375 256.9Z"/><path class="v-shade" data-shade="2" d="M396.5 262.3L375 276.3L375 256.9L396.5 242.9Z"/><path class="v-shade" data-shade="3" d="M396.5 242.9L375 256.9L345 249.3L366.4 235.3Z"/><path class="v-edge" data-tone="mid" d="M345 249.3L366.4 235.3L396.5 242.9L396.5 262.3L375 276.3L345 268.7Z"/></g><circle class="v-dot" data-tone="lo" cx="370.7" cy="246.1" r="0.9"/><g class="v-solid"><path class="v-fill" d="M293.6 255.6L315 241.6L345 249.3L345 268.7L323.6 282.6L293.6 275Z"/><path class="v-shade" data-shade="1" d="M323.6 282.6L293.6 275L293.6 255.6L323.6 263.2Z"/><path class="v-shade" data-shade="2" d="M345 268.7L323.6 282.6L323.6 263.2L345 249.3Z"/><path class="v-shade" data-shade="3" d="M345 249.3L323.6 263.2L293.6 255.6L315 241.6Z"/><path class="v-edge" data-tone="mid" d="M293.6 255.6L315 241.6L345 249.3L345 268.7L323.6 282.6L293.6 275Z"/></g><circle class="v-dot" data-tone="lo" cx="319.3" cy="252.4" r="0.9"/><g class="v-solid"><path class="v-fill" d="M323.6 263.2L345 249.3L375 256.9L375 276.3L353.6 290.2L323.6 282.6Z"/><path class="v-shade" data-shade="1" d="M353.6 290.2L323.6 282.6L323.6 263.2L353.6 270.8Z"/><path class="v-shade" data-shade="2" d="M375 276.3L353.6 290.2L353.6 270.8L375 256.9Z"/><path class="v-shade" data-shade="3" d="M375 256.9L353.6 270.8L323.6 263.2L345 249.3Z"/><path class="v-edge" data-tone="mid" d="M323.6 263.2L345 249.3L375 256.9L375 276.3L353.6 290.2L323.6 282.6Z"/></g><circle class="v-dot" data-tone="lo" cx="349.3" cy="260.1" r="0.9"/></svg></div></div></div><figcaption class="virion-legend"><span class="virion-keys"><span class="virion-key"><i class="virion-swatch" data-mark="lit"></i>The part this stage is about: the CD30 stalks, then the tails in TRAF2</span><span class="virion-key"><i class="virion-swatch" data-mark="mid"></i>A patch of cell membrane</span><span class="virion-key"><i class="virion-swatch" data-mark="lo"></i>The TRAF2 trimer under the membrane</span></span><span class="virion-caption">Classical Hodgkin lymphoma is not a virus and not a molecule you can draw as a particle. The Journal of Clinical Pathology review of the WHO fifth edition lists the minimal criteria as CD30-positive Hodgkin and Reed-Sternberg cells in a reactive microenvironment. This figure does not draw the Reed-Sternberg cell, the node, or the inflammatory cells around it. UniProt P28908 places CD30 in the cell membrane: extracellular residues 19–385, a transmembrane span 386–406, and a cytoplasmic region 407–595. The only experimental CD30 atoms in the PDB are entry 1D01: 9 deposited residues in each of chains G, H, and I, which UniProt maps to residues 576–583. Those peptides sit on the TRAF domain of TRAF2, a C3 trimer, biological assembly A3B3, 2.00 Å (Ye et al., Mol Cell 1999). The three stalks above the membrane stand in for the extracellular region, which that crystal does not contain. AlphaFold has a model of the rest of P28908; it is not drawn here. UniProt names NF-κB downstream of CD30. That step is not in this figure.</span><span class="virion-stages" data-stages><button type="button" data-stage="0" aria-pressed="false">1 Free</button><button type="button" data-stage="1" aria-pressed="false">2 Bound</button></span><span class="virion-sources"><a href="https://jcp.bmj.com/content/78/11/725">WHO review, J Clin Pathol 2025</a> · <a href="https://www.uniprot.org/uniprotkb/P28908/entry">UniProt P28908</a> · <a href="https://www.rcsb.org/structure/1D01">PDB 1D01</a> · <a href="https://doi.org/10.1016/s1097-2765(00)80334-2">Ye et al. 1999</a></span></figcaption></figure></main><script type="module">const RAD = Math.PI / 180;

function add(a, b) {
  return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
}

function sub(a, b) {
  return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}

function mul(a, s) {
  return [a[0] * s, a[1] * s, a[2] * s];
}

function dot(a, b) {
  return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
}

function cross(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}

function len(a) {
  return Math.hypot(a[0], a[1], a[2]);
}

function norm(a) {
  const l = len(a) || 1;
  return [a[0] / l, a[1] / l, a[2] / l];
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

function smooth(u, a, b) {
  if (u <= a) return 0;
  if (u >= b) return 1;
  const t = (u - a) / (b - a);
  return t * t * (3 - 2 * t);
}

function camera({ azimuth = 40, elevation = 28, scale = 2.55, origin = [360, 400] } = {}) {
  const a = azimuth * RAD;
  const e = elevation * RAD;
  return {
    azimuth,
    elevation,
    scale,
    origin,
    sinA: Math.sin(a),
    cosA: Math.cos(a),
    sinE: Math.sin(e),
    cosE: Math.cos(e),
  };
}

function project([x, y, z], cam) {
  const { sinA, cosA, sinE, cosE, scale, origin } = cam;
  return [
    origin[0] + (x * sinA - y * cosA) * scale,
    origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * scale,
  ];
}

function depthOf([x, y, z], cam) {
  return (x * cam.cosA + y * cam.sinA) * cam.cosE + z * cam.sinE;
}

function viewDir(cam) {
  return [cam.cosA * cam.cosE, cam.sinA * cam.cosE, cam.sinE];
}

const LIGHT = norm([-0.42, -0.38, 0.82]);

function shadeOf(normal) {
  const t = (dot(norm(normal), LIGHT) + 1) / 2;
  return Math.max(0, Math.min(3, Math.floor(t * 3.999)));
}

function tenth(value) {
  const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
  return text === "-0" ? "0" : text;
}

function pathOf(points, closed = false) {
  if (!points.length) return "";
  const d = points.map(([x, y], i) => `${i ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("");
  return closed ? `${d}Z` : d;
}

function convexHull(points) {
  const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (sorted.length < 3) return sorted;
  const cross2 = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of sorted) {
    while (lower.length >= 2 && cross2(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = sorted.length - 1; i >= 0; i--) {
    const p = sorted[i];
    while (upper.length >= 2 && cross2(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}

function fitOrigin(points, cam, width, height, pad = 28) {
  const bare = { ...cam, origin: [0, 0] };
  const projected = points.map((p) => project(p, bare));
  const xs = projected.map((p) => p[0]);
  const ys = projected.map((p) => p[1]);
  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);
  const spanX = maxX - minX || 1;
  const spanY = maxY - minY || 1;
  const scale = Math.min((width - pad * 2) / (spanX / cam.scale), (height - pad * 2) / (spanY / cam.scale));
  const fitted = camera({ azimuth: cam.azimuth, elevation: cam.elevation, scale, origin: [0, 0] });
  const again = points.map((p) => project(p, fitted));
  const xs2 = again.map((p) => p[0]);
  const ys2 = again.map((p) => p[1]);
  const cx = (Math.min(...xs2) + Math.max(...xs2)) / 2;
  const cy = (Math.min(...ys2) + Math.max(...ys2)) / 2;
  fitted.origin = [width / 2 - cx, height / 2 - cy];
  return fitted;
}



function ringPoints(origin, axis, radius, steps) {
  const up = Math.abs(axis[2]) < 0.85 ? [0, 0, 1] : [1, 0, 0];
  const u = norm(cross(axis, up));
  const v = cross(axis, u);
  return Array.from({ length: steps }, (_, i) => {
    const a = (i / steps) * Math.PI * 2;
    return add(origin, add(mul(u, Math.cos(a) * radius), mul(v, Math.sin(a) * radius)));
  });
}

function prism(bottom, top, cam) {
  const count = bottom.length;
  const view = viewDir(cam);
  const shades = [[], [], [], []];
  const projected = [];
  for (let i = 0; i < count; i++) {
    const j = (i + 1) % count;
    const n = norm(cross(sub(bottom[j], bottom[i]), sub(top[i], bottom[i])));
    const face = [bottom[i], bottom[j], top[j], top[i]];
    if (dot(n, view) > 0.02) {
      shades[shadeOf(n)].push(pathOf(face.map((p) => project(p, cam)), true));
    }
    projected.push(project(bottom[i], cam), project(top[i], cam));
  }
  const topN = norm(cross(sub(top[1], top[0]), sub(top[2] || top[0], top[0])));
  if (dot(topN, view) > 0.02) shades[shadeOf(topN)].push(pathOf(top.map((p) => project(p, cam)), true));
  const botN = norm(cross(sub(bottom[1], bottom[0]), sub(bottom[0], bottom[2] || bottom[0])));
  if (dot(botN, view) > 0.02) shades[shadeOf(botN)].push(pathOf(bottom.map((p) => project(p, cam)), true));
  const hull = convexHull(projected);
  const mid = mul(add(bottom[0], top[0]), 0.5);
  return {
    fill: pathOf(hull, true),
    shades: shades.map((parts) => parts.join("")),
    outline: pathOf(hull, true),
    depth: depthOf(mid, cam),
  };
}

function rod(from, to, radius, cam, steps = 12) {
  const axis = norm(sub(to, from));
  if (!Number.isFinite(axis[0]) || lenOrZero(sub(to, from)) < 0.15 || radius < 0.05) return null;
  const bottom = ringPoints(from, axis, radius, steps);
  const top = ringPoints(to, axis, radius, steps);
  const mesh = prism(bottom, top, cam);
  mesh.depth = depthOf(mul(add(from, to), 0.5), cam);
  return mesh;
}

function lenOrZero(a) {
  return Math.hypot(a[0], a[1], a[2]);
}

function box(x, y, w, d, z, h, cam) {
  const bottom = [
    [x, y, z],
    [x + w, y, z],
    [x + w, y + d, z],
    [x, y + d, z],
  ];
  const top = bottom.map((p) => [p[0], p[1], z + h]);
  const mesh = prism(bottom, top, cam);
  mesh.depth = depthOf([x + w / 2, y + d / 2, z + h / 2], cam);
  return mesh;
}

function sphere(center, radius, cam, { bands = 11, skipBottom = 0, spread = 0 } = {}) {
  const meshes = [];
  for (let i = 0; i < bands; i++) {
    const t0 = i / bands;
    const t1 = (i + 1) / bands;
    if (t1 <= skipBottom) continue;
    const lat0 = -Math.PI / 2 + Math.PI * Math.max(t0, skipBottom);
    const lat1 = -Math.PI / 2 + Math.PI * t1;
    const mid = (lat0 + lat1) / 2;
    const r = Math.max(0.4, Math.cos(mid) * radius);
    const z0 = center[2] + Math.sin(lat0) * radius + Math.sin(lat0) * spread;
    const z1 = center[2] + Math.sin(lat1) * radius + Math.sin(lat1) * spread;
    const mesh = rod([center[0], center[1], Math.min(z0, z1)], [center[0], center[1], Math.max(z0, z1)], r, cam, 18);
    if (mesh) meshes.push(mesh);
  }
  return meshes;
}

function solidSvg(mesh, { tone = "mid", lit = false, edge = true } = {}) {
  if (!mesh?.fill) return "";
  const shades = mesh.shades.map((d, i) => (d ? `<path class="v-shade" data-shade="${i}" d="${d}"/>` : "")).join("");
  const stroke = edge ? `<path class="v-edge" data-tone="${tone}" d="${mesh.outline}"/>` : "";
  return `<g class="v-solid"${lit ? ' data-lit=""' : ""}><path class="v-fill" d="${mesh.fill}"/>${shades}${stroke}</g>`;
}

function ball(center, radius, cam, { bands = 18, steps = 22 } = {}) {
  const shades = [[], [], [], []];
  const view = viewDir(cam);
  const samples = [];
  const ringAt = (lat) => Array.from({ length: steps }, (_, i) => {
    const a = (i / steps) * Math.PI * 2;
    const r = Math.cos(lat) * radius;
    return [center[0] + Math.cos(a) * r, center[1] + Math.sin(a) * r, center[2] + Math.sin(lat) * radius];
  });
  for (let band = 0; band < bands; band++) {
    const lat0 = -Math.PI / 2 + (Math.PI * band) / bands;
    const lat1 = -Math.PI / 2 + (Math.PI * (band + 1)) / bands;
    const bottom = ringAt(lat0);
    const top = ringAt(lat1);
    for (let i = 0; i < steps; i++) {
      const j = (i + 1) % steps;
      const n = norm(cross(sub(bottom[j], bottom[i]), sub(top[i], bottom[i])));
      if (dot(n, view) <= 0.04) continue;
      shades[shadeOf(n)].push(pathOf([bottom[i], bottom[j], top[j], top[i]].map((p) => project(p, cam)), true));
    }
    if (band % 2 === 0) samples.push(...bottom);
  }
  samples.push([center[0], center[1], center[2] + radius], [center[0], center[1], center[2] - radius]);
  const hull = convexHull(samples.map((p) => project(p, cam)));
  return {
    fill: pathOf(hull, true),
    shades: shades.map((parts) => parts.join("")),
    outline: pathOf(hull, true),
    depth: depthOf(center, cam),
  };
}

function dotSvg(point, cam, size, tone = "lo") {
  const [x, y] = project(point, cam);
  return `<circle class="v-dot" data-tone="${tone}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}"/>`;
}

function haloSvg(center, rx, ry, cam) {
  const [cx, cy] = project(center, cam);
  const [ex] = project([center[0] + rx, center[1], center[2]], cam);
  const [, ey] = project([center[0], center[1] + ry, center[2]], cam);
  const sx = Math.max(8, Math.hypot(ex - cx, 0));
  const sy = Math.max(6, Math.abs(ey - cy));
  return `<ellipse class="v-halo" cx="${cx.toFixed(1)}" cy="${(cy + 8).toFixed(1)}" rx="${sx.toFixed(1)}" ry="${sy.toFixed(1)}"/>`;
}

function sortItems(items) {
  return items.filter(Boolean).sort((a, b) => a.depth - b.depth);
}

function paintItem(mesh, style) {
  if (!mesh) return null;
  return { depth: mesh.depth, svg: solidSvg(mesh, style) };
}




function triad(axis) {
  const up = Math.abs(axis[2]) < 0.85 ? [0, 0, 1] : [1, 0, 0];
  const u = norm([axis[1] * up[2] - axis[2] * up[1], axis[2] * up[0] - axis[0] * up[2], axis[0] * up[1] - axis[1] * up[0]]);
  const v = [
    axis[1] * u[2] - axis[2] * u[1],
    axis[2] * u[0] - axis[0] * u[2],
    axis[0] * u[1] - axis[1] * u[0],
  ];
  return { u, v };
}

function feet(count, radius, axis) {
  const { u, v } = triad(axis);
  return Array.from({ length: count }, (_, i) => {
    const a = (i / count) * Math.PI * 2 + 0.4;
    return add(mul(u, Math.cos(a) * radius), mul(v, Math.sin(a) * radius));
  });
}

function membraneTile(tile, cam, { tone = "mid", edge = false } = {}) {
  const mesh = box(tile.x, tile.y, tile.w, tile.d, tile.z, tile.h, cam);
  const mark = dotSvg([tile.cx, tile.cy, tile.z + tile.h], cam, 0.9, "lo");
  const painted = paintItem(mesh, { tone, edge });
  if (!painted) return [];
  return [painted, { depth: mesh.depth + 0.02, svg: mark }];
}

function glycoprotein(base, height, headR, cam, { tone = "hi", lit = false, lobes = 1 } = {}) {
  const top = [base[0], base[1], base[2] + height];
  const items = [paintItem(rod(base, top, 1.15, cam, 8), { tone, lit })];
  if (headR > 0.25) {
    const head = add(top, [0, 0, headR * 0.65]);
    for (const mesh of sphere(head, headR, cam, { bands: 5 })) items.push(paintItem(mesh, { tone, lit }));
    if (lobes > 1) {
      for (const offset of feet(lobes, headR * 0.85, [0, 0, 1])) {
        const at = add(head, offset);
        for (const mesh of sphere(at, headR * 0.55, cam, { bands: 3 })) items.push(paintItem(mesh, { tone: "hi", lit }));
      }
    }
  }
  return items;
}

function spike(anchor, dir, { length, head, stalk, lobes, fusion = 0, peptide = 0, spread = 2.2 }, cam, { tone = "hi", lit = false } = {}) {
  const axis = norm(dir);
  const neck = add(anchor, mul(axis, Math.max(0.8, length - head * 0.8)));
  const tip = add(anchor, mul(axis, length));
  const items = [];
  for (const offset of feet(lobes, spread, axis)) {
    const from = add(anchor, offset);
    const to = add(neck, mul(offset, 0.25));
    items.push(paintItem(rod(from, to, stalk, cam, 7), { tone, lit }));
  }
  for (const mesh of sphere(tip, head * (1 - fusion * 0.18), cam, { bands: 5 })) {
    items.push(paintItem(mesh, { tone, lit }));
  }
  if (peptide > 0.4) {
    const end = add(tip, mul(axis, peptide));
    items.push(paintItem(rod(tip, end, Math.max(0.45, stalk * 0.55), cam, 6), { tone, lit }));
  }
  return items;
}

function envelope(center, radius, cam, { skipBottom = 0, spread = 0, cutaway = false, tone = "mid", lit = false, bands = 12 } = {}) {
  if (spread < 0.8 && !cutaway) return [paintItem(ball(center, radius, cam), { tone, lit })];
  const painted = sphere(center, radius, cam, { bands, skipBottom, spread }).map((mesh) => paintItem(mesh, { tone, lit })).filter(Boolean);
  if (!cutaway) return painted;
  const ordered = [...painted].sort((a, b) => a.depth - b.depth);
  return ordered.slice(0, Math.max(3, Math.ceil(ordered.length * 0.68)));
}

function rnpRod(from, to, cam, { lit = false } = {}) {
  const axis = norm(sub(to, from));
  const length = Math.hypot(to[0] - from[0], to[1] - from[1], to[2] - from[2]);
  const items = [paintItem(rod(from, to, 2.1, cam, 8), { tone: "hi", lit })];
  const turns = Math.max(2, Math.round(length / 7));
  for (let i = 1; i < turns; i++) {
    const at = add(from, mul(axis, (length * i) / turns));
    items.push(paintItem(rod(add(at, mul(axis, -0.35)), add(at, mul(axis, 0.35)), 2.55, cam, 8), { tone: "mid", lit }));
  }
  items.push(paintItem(rod(from, add(from, mul(axis, 1.2)), 2.8, cam, 8), { tone: "hi", lit }));
  return items;
}

const FACTS = {
  disease: {
    url: "https://jcp.bmj.com/content/78/11/725",
    criteria: "CD30-positive Hodgkin and Reed-Sternberg cells in a reactive microenvironment",
  },
  uniprot: {
    id: "P28908",
    url: "https://www.uniprot.org/uniprotkb/P28908/entry",
    alphafold: "https://alphafold.ebi.ac.uk/entry/P28908",
    extracellular: [19, 385],
    transmembrane: [386, 406],
    cytoplasmic: [407, 595],
    peptideMap: [576, 583],
  },
  pdb: {
    id: "1D01",
    url: "https://www.rcsb.org/structure/1D01",
    pdbe: "https://www.ebi.ac.uk/pdbe/entry/pdb/1d01",
    doi: "https://doi.org/10.1016/s1097-2765(00)80334-2",
    citation: "Ye et al., Mol Cell 1999",
    resolutionA: 2,
    traf2: 3,
    traf2Residues: 168,
    peptides: 3,
    peptideResidues: 9,
    assembly: "A3B3",
    symmetry: "C3",
  },
};




const COLS = 9;
const ROWS = 6;
const TW = 8;
const TD = 7;

const STAGES = [
  { id: "free", label: "Free", at: 0, key: "1" },
  { id: "bound", label: "Bound", at: 1, key: "2" },
];

function grid() {
  const width = COLS * TW;
  const depth = ROWS * TD;
  const x0 = -width / 2;
  const y0 = -depth / 2;
  const tiles = [];
  for (let j = 0; j < ROWS; j++) {
    for (let i = 0; i < COLS; i++) {
      const x = x0 + i * TW;
      const y = y0 + j * TD;
      tiles.push({ i, j, x, y, w: TW, d: TD, cx: x + TW / 2, cy: y + TD / 2, z: 0, h: 4.2 });
    }
  }
  return tiles;
}

const TILES = grid();

function sites() {
  return [0, 1, 2].map((i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 3;
    return {
      i,
      receptor: [Math.cos(a) * 14, Math.sin(a) * 14],
      core: [Math.cos(a) * 5.2, Math.sin(a) * 5.2],
    };
  });
}

const SITES = sites();

function pose(u, { azimuth = -32, elevation = 24, explode = 0 } = {}) {
  const t = clamp(u, 0, 1);
  const dock = smooth(t, 0, 1) * (1 - explode);
  const center = [0, 0, -30 - explode * 12];
  const membrane = TILES.map((tile) => {
    const rim = tile.i === 0 || tile.j === 0 || tile.i === COLS - 1 || tile.j === ROWS - 1;
    return { ...tile, edge: rim };
  });
  const receptors = SITES.map((site) => {
    const base = [site.receptor[0], site.receptor[1], 4.2];
    const under = [site.receptor[0], site.receptor[1], -0.8];
    const seat = [site.core[0], site.core[1], center[2]];
    const tip = [
      under[0] + (seat[0] - under[0]) * dock,
      under[1] + (seat[1] - under[1]) * dock,
      under[2] + (seat[2] - under[2]) * dock,
    ];
    const bound = Math.hypot(tip[0] - seat[0], tip[1] - seat[1], tip[2] - seat[2]) < 4.5;
    return { base, under, tip, seat, bound, height: 12 };
  });
  const bound = receptors.filter((item) => item.bound).length;
  const accent = bound === FACTS.pdb.peptides ? "traf" : "cd30";
  const stage = STAGES.reduce((best, item) => (Math.abs(item.at - t) < Math.abs(best.at - t) ? item : best));
  const readout = [
    `tails ${bound}/${FACTS.pdb.peptides}`,
    `TRAF2 ${FACTS.pdb.traf2}`,
    `peptide ${FACTS.pdb.peptideResidues}`,
    explode > 0.03 ? `apart ${explode.toFixed(2)}` : "",
  ].filter(Boolean).join(" · ");
  return {
    t,
    stage,
    dock,
    explode,
    accent,
    center,
    membrane,
    receptors,
    bound,
    readout,
    azimuth,
    elevation,
    cam: camera({ azimuth, elevation, scale: 2.7 }),
  };
}






const VIEW = { width: 720, height: 520 };

const FRAME = [
  [-40, -28, -52],
  [40, 28, -52],
  [-40, -28, 28],
  [40, 28, 28],
];

function sceneSvg(state) {
  const cam = fitOrigin(FRAME, state.cam, VIEW.width, VIEW.height, 36);
  const items = [haloSvg([0, 0, 0], 42, 26, cam)].map((svg) => ({ depth: -1e6, svg }));
  for (const tile of state.membrane) items.push(...membraneTile(tile, cam, { tone: "mid", edge: tile.edge }));
  const trafLit = state.accent === "traf";
  for (const receptor of state.receptors) {
    items.push(...glycoprotein(receptor.base, receptor.height, 2.1, cam, { tone: "hi", lit: state.accent === "cd30" }));
    items.push(paintItem(rod(receptor.under, receptor.tip, 0.7, cam, 7), { tone: "hi", lit: trafLit }));
    items.push(paintItem(ball(receptor.seat, 4.6, cam), { tone: "lo", lit: trafLit }));
    items.push(paintItem(rod(receptor.seat, state.center, 0.8, cam, 7), { tone: "lo", lit: trafLit }));
  }
  items.push(paintItem(ball(state.center, 3.1, cam), { tone: "lo", lit: trafLit }));
  const body = sortItems(items.filter(Boolean)).map((item) => item.svg).join("");
  const label = "Three schematic CD30 receptors on a membrane patch. Their cytoplasmic tails dock into a TRAF2 trimer, the complex in PDB 1D01. The Hodgkin cell is not drawn.";
  return `<svg class="v-svg" viewBox="0 0 ${VIEW.width} ${VIEW.height}" role="img" aria-label="${label}">${body}</svg>`;
}

function captionText() {
  const domain = FACTS.uniprot;
  const pdb = FACTS.pdb;
  return `Classical Hodgkin lymphoma is not a virus and not a molecule you can draw as a particle. The Journal of Clinical Pathology review of the WHO fifth edition lists the minimal criteria as ${FACTS.disease.criteria}. This figure does not draw the Reed-Sternberg cell, the node, or the inflammatory cells around it. UniProt ${domain.id} places CD30 in the cell membrane: extracellular residues ${domain.extracellular[0]}–${domain.extracellular[1]}, a transmembrane span ${domain.transmembrane[0]}–${domain.transmembrane[1]}, and a cytoplasmic region ${domain.cytoplasmic[0]}–${domain.cytoplasmic[1]}. The only experimental CD30 atoms in the PDB are entry ${pdb.id}: ${pdb.peptideResidues} deposited residues in each of chains G, H, and I, which UniProt maps to residues ${domain.peptideMap[0]}–${domain.peptideMap[1]}. Those peptides sit on the TRAF domain of TRAF2, a C3 trimer, biological assembly ${pdb.assembly}, ${pdb.resolutionA.toFixed(2)} Å (Ye et al., Mol Cell 1999). The three stalks above the membrane stand in for the extracellular region, which that crystal does not contain. AlphaFold has a model of the rest of ${domain.id}; it is not drawn here. UniProt names NF-κB downstream of CD30. That step is not in this figure.`;
}


const stageEl = document.querySelector("[data-stagebox]");
const sceneHost = document.querySelector("[data-scene]");
const readout = document.querySelector("[data-readout]");
const buttons = [...document.querySelectorAll("[data-stage]")];
const still = matchMedia("(prefers-reduced-motion: reduce)");
let azimuth = -32;
let elevation = 24;
let u = 1;
let target = u;
let explode = 0;
let explodeTarget = 0;
let speed = 1;
let playing = !still.matches;
let last = 0;
let frame = 0;
let idle = 0;
let drag = null;
function follow(current, next, dt, seconds) {
  if (still.matches || seconds <= 0) return next;
  const step = 1 - Math.exp(-dt / seconds);
  return current + (next - current) * step;
}
function nearest(value) {
  return STAGES.reduce((best, stage) => Math.abs(stage.at - value) < Math.abs(best.at - value) ? stage : best);
}
function render() {
  const state = pose(u, { azimuth, elevation, explode });
  sceneHost.innerHTML = sceneSvg(state);
  if (readout.textContent !== state.readout) readout.textContent = state.readout;
  const here = nearest(state.t);
  for (const button of buttons) button.setAttribute("aria-pressed", String(button.dataset.stage === String(here.at) && !playing));
  stageEl.setAttribute("aria-valuetext", state.readout);
}
function tick(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
  last = now;
  if (playing) target += dt * 0.22 * speed;
  if (target > 1.02) target = 0;
  u = follow(u, target, dt, playing ? 0.08 : 0.45);
  explode = follow(explode, explodeTarget, dt, 0.4);
  render();
  const settled = !playing && Math.abs(u - target) < 0.004 && Math.abs(explode - explodeTarget) < 0.004;
  frame = settled ? 0 : requestAnimationFrame(tick);
}
function wake() {
  if (!frame) { last = 0; frame = requestAnimationFrame(tick); }
}
function hold(next, play) {
  playing = Boolean(play) && !still.matches;
  target = next;
  clearTimeout(idle);
  idle = setTimeout(() => { if (!still.matches) { playing = true; wake(); } }, 8000);
  wake();
}
stageEl.addEventListener("pointerdown", (event) => {
  drag = { x: event.clientX, y: event.clientY, azimuth, elevation, moved: false };
  stageEl.setPointerCapture(event.pointerId);
  hold(target, false);
});
stageEl.addEventListener("pointermove", (event) => {
  if (!drag) return;
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  if (Math.hypot(dx, dy) > 3) drag.moved = true;
  azimuth = drag.azimuth + dx * 0.35;
  elevation = Math.max(12, Math.min(42, drag.elevation - dy * 0.12));
  wake();
});
function endDrag() { drag = null; }
stageEl.addEventListener("pointerup", endDrag);
stageEl.addEventListener("pointercancel", endDrag);
stageEl.addEventListener("keydown", (event) => {
  const order = STAGES.map((stage) => stage.at);
  const here = nearest(target).at;
  const index = Math.max(0, order.indexOf(here));
  const lastKey = String(order.length);
  if (event.key >= "1" && event.key <= lastKey) hold(order[Number(event.key) - 1], false);
  else if (event.key === "ArrowRight") hold(order[Math.min(order.length - 1, index + 1)], false);
  else if (event.key === "ArrowLeft") hold(order[Math.max(0, index - 1)], false);
  else if (event.key === " ") { event.preventDefault(); hold(target, !playing); }
  else if (event.key === "e" || event.key === "E") { explodeTarget = explodeTarget > 0.5 ? 0 : 1; wake(); }
  else if (event.key === "[") speed = Math.max(0.25, speed / 1.6);
  else if (event.key === "]") speed = Math.min(3, speed * 1.6);
  else return;
  event.preventDefault();
});
for (const button of buttons) {
  button.addEventListener("click", () => hold(Number(button.dataset.stage), false));
}
render();
if (playing) wake();
</script></body></html>
